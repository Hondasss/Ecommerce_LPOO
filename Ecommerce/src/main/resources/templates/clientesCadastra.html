<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastrar Cliente</title>
</head>
<body>
    <h1>Cadastrar Cliente</h1>
    
    <form th:action="@{/clientes/salvar}" method="post" th:object="${cliente}">
        <h2>Dados do Cliente</h2>
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required>
        </div>
        <div>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" th:field="*{cpf}" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required>
        </div>
        
        <h2>Dados do Endereço</h2>
        <div>
            <label for="endereco.logradouro">Logradouro:</label>
            <input type="text" id="endereco.logradouro" th:field="*{endereco.logradouro}" required>
        </div>
        <div>
            <label for="endereco.numero">Número:</label>
            <input type="text" id="endereco.numero" th:field="*{endereco.numero}" required>
        </div>
        <div>
            <label for="endereco.bairro">Bairro:</label>
            <input type="text" id="endereco.bairro" th:field="*{endereco.bairro}" required>
        </div>
        <div>
            <label for="endereco.cidade">Cidade:</label>
            <input type="text" id="endereco.cidade" th:field="*{endereco.cidade}" required>
        </div>
        <div>
            <label for="endereco.estado">Estado:</label>
            <input type="text" id="endereco.estado" th:field="*{endereco.estado}" required>
        </div>
        <div>
            <label for="endereco.cep">CEP:</label>
            <input type="text" id="endereco.cep" th:field="*{endereco.cep}" required>
        </div>
        
        <button type="submit">Salvar</button>
    </form>
    
    <a th:href="@{/clientes}">Voltar</a>
</body>
</html>
