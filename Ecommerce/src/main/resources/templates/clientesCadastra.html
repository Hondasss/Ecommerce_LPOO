<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Cliente</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <h1>Cadastrar Cliente</h1>
    <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
        <h2>Dados do Cliente</h2>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required>
        
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" th:field="*{cpf}" required>
        
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required>
        
        <h2>Dados do Endereço</h2>
        <label for="logradouro">Logradouro:</label>
        <input type="text" id="logradouro" th:field="*{endereco.logradouro}" required>
        
        <label for="numero">Número:</label>
        <input type="text" id="numero" th:field="*{endereco.numero}" required>
        
        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" th:field="*{endereco.bairro}" required>
        
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" th:field="*{endereco.cidade}" required>
        
        <label for="estado">Estado:</label>
        <input type="text" id="estado" th:field="*{endereco.estado}" required>
        
        <label for="cep">CEP:</label>
        <input type="text" id="cep" th:field="*{endereco.cep}" required>
        
        <button type="submit">Salvar</button>
    </form>
    <p th:text="${mensagem}" style="color: green;"></p>
    <a href="/clientes">Voltar</a>
</body>
</html>
