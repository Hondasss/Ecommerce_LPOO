<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
    <link rel="stylesheet" href="/produtos.css">
</head>
<body>
    <div class="container">
        <h1>Lista de Produtos</h1>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Ação</th> <!-- Coluna para o botão -->
                </tr>
            </thead>
            <tbody>
                <!-- Loop através dos produtos passados pelo controlador -->
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.descricao}"></td>
                    <td th:text="${produto.preco}"></td>
                    <td th:text="${produto.categoria.nome}"></td>
                    <!-- Adicionar formulário para o botão de compra -->
                    <td>
                        <form th:action="@{/carrinho/adicionar}" method="post">
                            <input type="hidden" th:name="produtoId" th:value="${produto.id}" />
                            <button type="submit" class="buy-button">Comprar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
