<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link rel="stylesheet" type="text/css" th:href="@{/produtos.css}">
</head>
<body>
    <div class="container">
        <h1>Lista de Produtos</h1>
        
        <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
        
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.descricao}"></td>
                    <td th:text="${#numbers.formatDecimal(produto.preco, 1, 2)}"></td>
                    <td th:text="${produto.categoria.nome}"></td>
                    <td>
                        <form th:action="@{/carrinho/adicionar}" method="post">
                            <input type="hidden" name="produtoId" th:value="${produto.id}" />
                            <input type="hidden" name="quantidade" value="1" />
                            <button type="submit">Comprar</button>
                        </form>
                        <form th:action="@{/produtos/deletar}" method="post" style="display: inline;">
                            <input type="hidden" name="id" th:value="${produto.id}" />
                            <button type="submit">Deletar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <a th:href="@{/produtos/cadastrar}">Cadastrar Novo Produto</a>
        <a th:href="@{/carrinho}">Ver Carrinho</a>
		<a href="/main" class="back-button">Voltar ao menu</a>
    </div>
</body>
</html>
