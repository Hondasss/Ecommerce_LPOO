<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="stylesheet" href="/carrinho.css">
</head>
<body>
    <div class="container">
        <h1>Seu Carrinho</h1>
        <table>
            <thead>
                <tr>
                    <th>Nome do Produto</th>
                    <th>Quantidade</th>
                    <th>Preço Unitário</th>
                    <th>Preço Total</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
                <!-- Loop através dos itens do carrinho -->
                <tr th:each="item : ${itensCarrinho}">
                    <td th:text="${item.produto.nome}"></td>
                    <td th:text="${item.quantidade}"></td>
                    <td th:text="${item.produto.preco}"></td>
                    <td th:text="${#numbers.formatDecimal(item.produto.preco * item.quantidade, 2)}"></td>
                    <!-- Formulário para remover item -->
                    <td>
                        <form th:action="@{/carrinho/remover}" method="post">
                            <input type="hidden" th:name="itemId" th:value="${item.id}" />
                            <button type="submit" class="remove-button">Remover</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <!-- Botão para finalizar compra -->
        <form th:action="@{/carrinho/finalizar}" method="post">
            <button type="submit" class="finalize-button">Finalizar Compra</button>
        </form>
    </div>
</body>
</html>
